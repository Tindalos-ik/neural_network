[project]
name = "convolutional-neural-network"
version = "0.1.0"
description = "PyTorch CNN experiments based on LeNet, AlexNet, VGG, GoogLeNet, and ResNet."
requires-python = ">=3.11"
dependencies = [
    "torch>=2.6",
    "torchvision>=0.21",
    "torchsummary>=1.5.1",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "pillow>=10.4",
]

[tool.uv]
# Standalone training scripts, not an installable Python package.
# Install dependencies with: uv sync
# CUDA-specific PyTorch wheels require an index matching the target GPU/driver.
package = false
