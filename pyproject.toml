[project]
name = "neural-network-experiments"
version = "0.1.0"
description = "PyTorch experiments for image classification and object detection."
requires-python = ">=3.11,<3.12"
dependencies = [
    "ipykernel>=6.29,<8",
    "matplotlib>=3.7.5,<3.11",
    "numpy==1.23.5",  # Legacy YOLOv3 uses np.int and np.float.
    "opencv-python>=4.10.0.84,<4.12",  # OpenCV 4.12+ requires NumPy 2 on Python 3.11.
    "pillow>=9.5,<10",  # Legacy YOLOv3 uses ImageFont.getsize().
    "pyyaml>=6.0.1,<7",
    "requests>=2.32.4,<3",
    "scipy>=1.10.1,<1.16",
    "setuptools<81",  # Legacy YOLOv3 imports pkg_resources.
    "torch>=2.11,<2.12",
    "torchsummary>=1.5.1,<2",
    "torchvision>=0.26,<0.27",
    "tqdm>=4.66.4,<5",
    "tensorboard>=2.14,<3",
    "pandas>=2.0.3,<2.3",
    "seaborn>=0.13.2,<0.14",
    "thop>=0.1.1,<0.2",
    "pycocotools>=2.0.10,<3",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
